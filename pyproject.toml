[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "geno2flux"
version = "0.1.0"
description = "Genome-scale metabolic reconstruction, compartment refinement, and dual-metric intervention prioritization"
requires-python = ">=3.11,<3.13"
license = {text = "GPL-3.0-only"}
dependencies = ["biopython==1.86", "cobra==0.31.1", "pandas==2.2.3", "numpy==2.2.6", "scipy==1.15.3", "openpyxl==3.1.5", "highspy==1.15.1", "matplotlib==3.10.9"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
geno2flux = "geno2flux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geno2flux"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "geno2flux/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
